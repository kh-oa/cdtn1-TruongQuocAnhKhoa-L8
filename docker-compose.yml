
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: l8_csat_nps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d l8_csat_nps"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build: .
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    environment: &backend-env
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: l8_csat_nps
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      <<: *backend-env
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
